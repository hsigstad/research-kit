<style>
  :root {
    --bg: #faf9f6; --card: #fffefa; --fg: #374151; --muted: #6b7280;
    --border: #e5e2db; --accent: #2563eb; --accent2: #198754;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.5;
  }
  main { padding: 1.5rem 2rem 3rem; max-width: 42rem; margin: 0 auto; }
  .md-body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.06rem; line-height: 1.78; color: var(--fg);
  }
  .md-body h1 { font-size: 1.5rem; font-weight: 600; margin: 1.8rem 0 .8rem;
    padding-bottom: .3rem; border-bottom: 1px solid var(--border);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .md-body h2 { font-size: 1.25rem; font-weight: 600; margin: 1.6rem 0 .6rem;
    padding-bottom: .25rem; border-bottom: 1px solid var(--border);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .md-body h3 { font-size: 1.05rem; font-weight: 600; margin: 1.3rem 0 .5rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .md-body p { margin: 0 0 .8rem; }
  .md-body ul, .md-body ol { margin: 0 0 .8rem; padding-left: 1.8rem; }
  .md-body li { margin-bottom: .25rem; }
  .md-body a { color: var(--accent); text-decoration: none; }
  .md-body a:hover { text-decoration: underline; }
  .md-body blockquote {
    margin: 0 0 .8rem; padding: .4rem 1rem;
    border-left: 4px solid var(--accent); background: #f5f3ee;
    color: #555;
  }
  .md-body code {
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: .85em; background: #f0ede6; padding: .15rem .35rem;
    border-radius: 4px;
  }
  .md-body pre {
    margin: 0 0 .8rem; padding: .9rem 1rem;
    background: #f5f3ee; border: 1px solid var(--border);
    border-radius: 6px; overflow-x: auto;
  }
  .md-body pre code { background: none; padding: 0; }
  .md-body table {
    width: 100%; border-collapse: collapse; margin: 0 0 .8rem; font-size: .9rem;
  }
  .md-body th, .md-body td {
    padding: .45rem .7rem; border: 1px solid var(--border); text-align: left;
  }
  .md-body th { background: #f5f3ee; font-weight: 600; }
  .md-body tr:nth-child(even) td { background: var(--bg); }
  .md-body img { max-width: 100%; }
  .md-body li:target { background: #fff8c4; scroll-margin-top: 4rem; }
  .md-body a.cite-ref, .md-body a.anec-ref, .md-body a.concept-ref {
    color: var(--fg); text-decoration: none;
    border-bottom: 1px dotted var(--accent);
  }
  .md-body a.cite-ref:hover, .md-body a.anec-ref:hover,
  .md-body a.concept-ref:hover { border-bottom-style: solid; }
  footer {
    text-align: center; padding: 1.5rem; font-size: .8rem; color: var(--muted);
    border-top: 1px solid var(--border); margin-top: 2rem;
  }
</style>
