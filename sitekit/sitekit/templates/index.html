<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- INJECT_PROJECT_TITLE --></title>
<style>
  :root {
    --bg: #faf9f6; --card: #fffefa; --fg: #374151; --muted: #6b7280;
    --border: #e5e2db; --accent: #2563eb; --accent2: #198754;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.5; font-size: .88rem;
  }
  main { padding: 1.4rem 2rem 1.5rem; max-width: 900px; margin: 0 auto; }
  h2 { font-size: 1.05rem; font-weight: 600; margin: 1.6rem 0 .6rem; }
  .summary-box {
    background: var(--card); border: 1px solid var(--border);
    border-left: 4px solid var(--accent); border-radius: 6px;
    padding: .9rem 1.1rem; margin-bottom: 1.4rem;
    font-size: .95rem; line-height: 1.6;
  }
  .guide-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
    margin-bottom: 1.8rem;
  }
  .guide-card {
    display: block; background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; padding: .85rem 1.1rem;
    text-decoration: none; color: var(--fg);
  }
  .guide-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,.08); }
  .guide-card .priority {
    font-size: .62rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; margin-bottom: .15rem;
  }
  .priority-start { color: #c0392b; }
  .priority-main  { color: var(--accent); }
  .priority-ref   { color: var(--muted); }
  .guide-card .label { font-size: 1rem; font-weight: 600; margin-bottom: .25rem; }
  .guide-card .desc  { font-size: .85rem; color: var(--muted); line-height: 1.5; }
  .guide-card.placeholder { opacity: .55; }
  .doc-groups { display: flex; gap: .8rem; flex-wrap: wrap; }
  .doc-group {
    flex: 1; min-width: 180px; background: var(--card); border: 1px solid var(--border);
    border-top: 3px solid var(--border); border-radius: 6px; padding: .7rem .9rem;
  }
  .doc-group h3 {
    font-size: .68rem; text-transform: uppercase; color: var(--muted);
    letter-spacing: .04em; font-weight: 700; margin-bottom: .35rem;
  }
  .link-list { list-style: none; padding: 0; margin: 0; }
  .link-list li { padding: .05rem 0; }
  .link-list a { color: var(--accent); text-decoration: none; font-size: .82rem; }
  .link-list a:hover { text-decoration: underline; }
  footer {
    text-align: center; padding: .8rem; font-size: .7rem; color: var(--muted);
    border-top: 1px solid var(--border); margin-top: 1.2rem;
  }
</style>
</head>
<body>

<!-- INJECT_NAV -->

<main>
<h2>Reading Guide</h2>
<div class="guide-grid">
<!-- INJECT_GUIDE_CARDS -->
</div>

<h2>All Documentation</h2>
<div class="doc-groups">
<!-- INJECT_DOC_CARDS -->
</div>
</main>

<footer>Generated by <code>sitekit</code></footer>
</body>
</html>
